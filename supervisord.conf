[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:api]
command=/usr/local/bin/deno run
    --config /app/apps/api/deno.json
    --allow-net
    --allow-env
    --allow-read
    --allow-write
    /app/apps/api/src/server.ts
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=API_HOST="127.0.0.1",API_PORT="8787",DATABASE_PATH="/data/music.db",AUDIO_STORAGE_PATH="/data/audio",DENO_DIR="/deno-cache"
priority=20
